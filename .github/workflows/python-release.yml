name: Reusable Python Release

# Two-job release: `build` (contents: read, no OIDC) builds dist + SBOM, `publish`
# (id-token: write) only downloads `dist` and uploads. Requires a committed,
# current `uv.lock` (SBOM is exported with `uv export --locked`).

on:
  workflow_call:
    inputs:
      release-environment:
        description: "GitHub Environment gating publish (required reviewers = QM/beta gate)"
        type: string
        default: "pypi"
      prerelease:
        description: "Publish as a pre-release (PyPI pre-release tags, e.g. 1.6.0b1)"
        type: boolean
        default: false
      config-file:
        description: "Path to the release-please config file (relative to consumer repo root)"
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "Path to the release-please manifest file (relative to consumer repo root)"
        type: string
        default: ".release-please-manifest.json"

# Least-privilege default; the release-please job below re-grants what it needs.
permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        id: rp
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  build:
    name: Build + SBOM (no OIDC)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false
      - name: Build distributions
        run: uv build
      # --locked fails on a missing/stale uv.lock instead of emitting a wrong SBOM.
      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file sbom-requirements.txt
      - name: Generate CycloneDX SBOM
        run: uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements --pyproject pyproject.toml --mc-type library --output-format JSON --output-file sbom.cdx.json sbom-requirements.txt
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  publish:
    name: Publish to PyPI (OIDC)
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: ${{ inputs.prerelease }}
          attestations: true
