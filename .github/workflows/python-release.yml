name: Reusable Python Release

# Two-job release: `build` (contents: read, no OIDC) builds dist + SBOM, `publish`
# (id-token: write) only downloads `dist` and uploads. Requires a committed,
# current `uv.lock` (SBOM is exported with `uv export --locked`).

on:
  workflow_call:
    inputs:
      release-environment:
        description: "GitHub Environment gating publish (required reviewers = QM/beta gate)"
        type: string
        default: "pypi"
      prerelease:
        description: "Publish as a pre-release (PyPI pre-release tags, e.g. 1.6.0b1)"
        type: boolean
        default: false
      config-file:
        description: "Path to the release-please config file (relative to consumer repo root)"
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "Path to the release-please manifest file (relative to consumer repo root)"
        type: string
        default: ".release-please-manifest.json"

# Least-privilege default; the release-please job below re-grants what it needs.
permissions:
  contents: read

# Queue overlapping runs for the same ref; never cancel a running publish.
concurrency:
  group: shipwright-python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  build:
    name: Build + SBOM (no OIDC)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # --locked fails on a missing/stale uv.lock instead of emitting a wrong SBOM.
      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file sbom-requirements.txt
      - name: Generate CycloneDX SBOM
        run: uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements --pyproject pyproject.toml --mc-type library --output-format JSON --output-file sbom.cdx.json sbom-requirements.txt
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  publish:
    name: Publish to PyPI (OIDC)
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment }}
    permissions:
      id-token: write # OIDC token for the Trusted Publisher
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Sanity-check dist contents
        # Catches stray/extra files in the downloaded artifact (only *.whl and
        # *.tar.gz, at least one of each). Does NOT detect content tampering.
        run: |
          shopt -s nullglob
          whl=(dist/*.whl); sdist=(dist/*.tar.gz); all=(dist/*)
          [ ${#whl[@]} -ge 1 ] && [ ${#sdist[@]} -ge 1 ] && [ ${#all[@]} -eq $(( ${#whl[@]} + ${#sdist[@]} )) ] || { ls -la dist; echo "::error::unexpected dist contents"; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: ${{ inputs.prerelease }}
          attestations: true
