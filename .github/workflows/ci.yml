name: CI
on:
  push:
  pull_request:

# Least-privilege default: none of these jobs write to the repo, comment on
# PRs, or touch other scopes — read-only checkout is all they need.
permissions:
  contents: read

jobs:
  ci:
    # Dogfood: Shipwright's CI runs the framework's own reusable workflow.
    uses: ./.github/workflows/python-ci.yml
    with:
      run-build: true

  # Type gate — mypy over the library (config in pyproject [tool.mypy]).
  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --dev
      - run: uv run mypy

  # Template self-test (G11/G8): render the Copier template into a throwaway
  # project and run THAT project's own QA gate (sync + lint + format-check + tests
  # + offline dogfood). Proves the scaffolder emits a working, QA-passing project
  # end-to-end, for both pack presets. Needs network (generated project pulls
  # shipwright-kit from git).
  template-selftest:
    name: Template self-test (scaffold + QA gate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [none, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --dev
      - env:
          PRESET: ${{ matrix.preset }}
        run: bash scripts/template-selftest.sh "$PRESET"

  # Supply-chain: generate a CycloneDX SBOM of the locked runtime deps on every CI run
  # (demonstrable now; the release pipeline attaches one at publish time too).
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file sbom-requirements.txt
      - run: uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements --pyproject pyproject.toml --mc-type library --output-format JSON --output-file sbom.cdx.json sbom-requirements.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
