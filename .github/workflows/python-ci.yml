name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to test against"
        type: string
        default: "3.11"
      working-directory:
        description: "Directory of the project to build/test"
        type: string
        default: "."
      run-build:
        description: "Whether to run 'uv build' (set false for non-package repos)"
        type: boolean
        default: true

jobs:
  lint-and-test:
    name: Lint, test${{ inputs.run-build && ', build' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version consistency
        # Guard against pyproject [project].version drifting from a package
        # __version__ literal (e.g. a release that bumps pyproject.toml but not
        # __init__.py). Generic across the fleet; no-op for repos with a dynamic
        # or absent version, or with no __version__ literal. Runs on the bare
        # checkout (system python3 only) before any dependency install.
        run: |
          python3 - <<'PYEOF'
          import tomllib, pathlib, re, sys
          proj = tomllib.load(open("pyproject.toml", "rb")).get("project", {})
          ver = proj.get("version")
          if not ver:
              print("No static [project].version (dynamic or absent) — skipping.")
              sys.exit(0)
          bad = []
          for p in pathlib.Path(".").rglob("__init__.py"):
              if any(x in p.parts for x in (".venv", "build", "dist", "tests")):
                  continue
              m = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', p.read_text(), re.M)
              if m and m.group(1) != ver:
                  bad.append(f"{p}: __version__={m.group(1)} != pyproject {ver}")
          if bad:
              print("Version drift:\n  " + "\n  ".join(bad)); sys.exit(1)
          print(f"Version consistent: {ver}")
          PYEOF
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Set up Python
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: uv python install "$PYTHON_VERSION"
      - name: Workflow lint (zizmor, online)
        # Security-focused GHA linter — catches the aikido-found bug classes
        # (template-injection ${{ }} in run:, missing persist-credentials:false,
        # broad permissions, unpinned actions) BEFORE merge. This step runs
        # inside the reusable workflow, so it lints the CALLING repo's checked-
        # out .github/workflows/ — every consumer (sift/vex/barb) that calls this
        # reusable gets the gate for free (fleet propagation). Version pinned so
        # a zizmor release with new/changed rules can't silently break fleet CI;
        # bump deliberately after a local `uvx zizmor@<new>` run stays green.
        # Online on purpose: the online audits (known-vulnerable-actions,
        # impostor-commit) are what catch a vulnerable pinned action such as
        # GHSA-5xjx-3w67-w9x9; dependabot alone does not gate a merge. Online
        # audits silently no-op without a token, so (1) the step fails when
        # GH_TOKEN is empty and (2) a canary workflow pinned to the vulnerable
        # action must be flagged with that exact advisory ID, else the step fails
        # (never trusts a bare exit code). ref-version-mismatch stays disabled:
        # it is comment hygiene (the SHA pin is authoritative). The config lives
        # in $RUNNER_TEMP because a reusable workflow only checks out the
        # CALLER's repo. The real scan targets the repo ROOT (not just
        # .github/workflows/) so composite actions under .github/actions/ and
        # dependabot.yml are covered. --collect=all also scans files that are
        # gitignored; --strict-collection makes an unparsable/schema-invalid
        # workflow a hard error instead of a skipped WARN with rc 0;
        # --no-ignores disables inline "# zizmor: ignore[...]" comments so a
        # finding cannot be silenced from the PR. --config and --no-ignores
        # deliberately REPLACE a consumer's own .github/zizmor.yml and its
        # inline ignores. Editing the caller's ci.yml is out of scope here
        # (branch protection / CODEOWNERS).
        # Accepted flake mode: needs github.com; an outage or bad token fails
        # the step (fail-closed).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::GH_TOKEN empty - zizmor online audits would silently no-op"; exit 1; }
          cfg="$RUNNER_TEMP/zizmor.yml"
          cat > "$cfg" <<'ZCFG'
          rules:
            ref-version-mismatch:
              disable: true
          ZCFG
          canary="$RUNNER_TEMP/zizmor-canary"
          mkdir -p "$canary/.github/workflows"
          cat > "$canary/.github/workflows/canary.yml" <<'CANARY'
          name: canary
          on: workflow_dispatch
          permissions: {}
          jobs:
            canary:
              runs-on: ubuntu-latest
              permissions: {}
              steps:
                - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
          CANARY
          out=$(uvx zizmor@1.26.1 --config "$cfg" "$canary" 2>&1) || true
          grep -q 'GHSA-5xjx-3w67-w9x9' <<<"$out" || { echo "$out"; echo "::error::zizmor canary not flagged (online audit inactive or API error, see output above)"; exit 1; }
          uvx zizmor@1.26.1 --strict-collection --collect=all --no-ignores --config "$cfg" "$GITHUB_WORKSPACE"
      - name: Workflow lint (actionlint)
        # Syntax/semantics linter (not security-focused — zizmor covers that).
        # reporter:local + filter_mode:nofilter + fail_level:error: reports ALL
        # findings (no PR diff needed — nofilter is required on push events, where
        # reporter:local's default diff-filter has no diff and errors with "diff
        # command is empty") and fails the step on actionlint errors, without
        # needing PR-check/write permissions (read-only token is enough).
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Sync dev environment
        run: uv sync --locked --dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Build
        if: ${{ inputs.run-build }}
        run: uv build
